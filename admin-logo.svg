<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    FoodShare ADMIN logó – ugyanaz az automata, de sötét háttéren, egy narancs fogaskerékkel.
    Így első ránézésre látszik, melyik ikon az admin és melyik a sima app.
  -->

  <!-- 1. Háttér: sötétzöld (a sima logó világoszöld) -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="#1e3a2f"/>

  <!-- 2. Az automata teste -->
  <rect x="11" y="15" width="34" height="38" rx="6" fill="#ffffff"/>
  <rect x="15" y="19" width="12" height="14" rx="2.5" fill="#d5f5e3"/>
  <rect x="29" y="19" width="12" height="14" rx="2.5" fill="#d5f5e3"/>
  <rect x="15" y="35" width="12" height="14" rx="2.5" fill="#d5f5e3"/>
  <rect x="29" y="35" width="12" height="14" rx="2.5" fill="#27ae60"/>

  <!-- 3. Levél a tetején -->
  <path d="M28 15 C28 9 32 5 39 5 C39 11 35 15 28 15 Z" fill="#a9dfbf"/>

  <!-- 4. Narancs fogaskerék jobb alul = "admin / beállítások" -->
  <g transform="translate(47 47)">
    <circle r="13" fill="#1e3a2f"/>
    <g fill="#f39c12">
      <rect x="-2.6" y="-11" width="5.2" height="22" rx="1.4"/>
      <rect x="-2.6" y="-11" width="5.2" height="22" rx="1.4" transform="rotate(45)"/>
      <rect x="-2.6" y="-11" width="5.2" height="22" rx="1.4" transform="rotate(90)"/>
      <rect x="-2.6" y="-11" width="5.2" height="22" rx="1.4" transform="rotate(135)"/>
      <circle r="8"/>
    </g>
    <circle r="3.4" fill="#1e3a2f"/>
  </g>
</svg>
