<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    FoodShare logó – egy hűtőautomata, amiből egy levél nő ki.
    Az SVG koordinátarendszere 64x64-es: (0,0) a bal felső sarok, (64,64) a jobb alsó.
    SZÍNEK: írd át a fill="..." / stroke="..." értékeket.
  -->

  <!-- 1. Háttér: lekerekített zöld négyzet (rx = a sarkok kerekítése) -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="#27ae60"/>

  <!-- 2. Az automata teste (fehér) -->
  <rect x="15" y="17" width="34" height="38" rx="6" fill="#ffffff"/>

  <!-- 3. Rekeszek: 2 oszlop x 2 sor (halványzöld ajtók) -->
  <rect x="19" y="21" width="12" height="14" rx="2.5" fill="#d5f5e3"/>
  <rect x="33" y="21" width="12" height="14" rx="2.5" fill="#d5f5e3"/>
  <rect x="19" y="37" width="12" height="14" rx="2.5" fill="#d5f5e3"/>
  <!-- ez a rekesz "teli": sötétebb zöld, benne egy kis alma -->
  <rect x="33" y="37" width="12" height="14" rx="2.5" fill="#27ae60"/>
  <circle cx="39" cy="45" r="3.6" fill="#ffffff"/>
  <path d="M39 41.4 q1.2 -2 2.6 -2.2" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- 4. Ajtófogantyúk (kis vonalak) -->
  <rect x="28" y="26" width="1.6" height="4" rx="0.8" fill="#27ae60"/>
  <rect x="42" y="26" width="1.6" height="4" rx="0.8" fill="#27ae60"/>
  <rect x="28" y="42" width="1.6" height="4" rx="0.8" fill="#27ae60"/>

  <!-- 5. A tetején kinövő levél (a "mentés", "frissesség" jelképe) -->
  <path d="M32 17 C32 11 36 7 43 7 C43 13 39 17 32 17 Z" fill="#a9dfbf"/>
  <path d="M32 17 C34 13 37 10.5 40.5 9.5" stroke="#27ae60" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
